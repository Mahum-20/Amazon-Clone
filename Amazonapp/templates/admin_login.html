{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static '/css/registeration.css' %}" />
    <title>Amazon</title>
  </head>
  <body>
    <div class="container d-flex justify-content-center mt-2">
      <div class="row">
        <div class="col-12">
          <img
            class="mb-2"
            src="{% static '/images/AmazonBlack.png' %}"
            alt="My image"
            style="width: 130px"
          />
        </div>
      </div>
    </div>

    <div class="container d-flex justify-content-center flex-row">
      <div class="row">
        <div class="col-md-12">
          <form class="border" action="/admin_login/" method="post">
            {% csrf_token %} {% for message in messages %}
            <div
              class="alert alert-{{message.tags}} alert-dismissible fade show"
              role="alert"
            >
              <strong></strong>{{message}}
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            {% endfor %} {% block extra_js %}
            <script>
              document.addEventListener("DOMContentLoaded", function () {
                var closeButtons = document.querySelectorAll(".alert .close");

                closeButtons.forEach(function (button) {
                  button.addEventListener("click", function () {
                    this.parentNode.style.display = "none";
                  });
                });
              });
            </script>
            {% endblock %}
            <div class="form-group">
              <p class="heading mt-3">Sign in</p>
            </div>
            <div class="form-group mt-3 mb-3">
              <label for="exampleInputEmail">Email</label>
              <input
                name="email"
                type="email"
                class="form-control"
                id="exampleInputEmail"
                aria-describedby="emailHelp"
                placeholder="Enter email"
              />
            </div>
            <div class="form-group mt-3 mb-3">
              <label for="exampleInputPassword">Password</label>
              <input
                name="password"
                type="password"
                class="form-control"
                id="exampleInputPassword"
                placeholder="Password"
              />
            </div>
            <div class="container d-flex justify-content-end">
              <a href="/fpass" class="mb-2">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block pd-auto">
              Continue
            </button>
            <p class="mt-3"><a href="/admin1/" />Login as User</p>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
